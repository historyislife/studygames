<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>歴史人物 神経衰弱</title>
<style>
:root{--bg:#f4efe3;--ink:#29251f;--accent:#9b3a2f;--gold:#c89b3c;--card:#fffaf0;--back:#2f536f;--ok:#39754a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{min-height:100dvh;display:flex;justify-content:center}.app{width:min(100%,560px);min-height:100dvh;padding:8px 10px 14px;display:flex;flex-direction:column;gap:7px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:900;font-size:clamp(17px,5vw,25px);letter-spacing:.04em}.stats{display:flex;gap:6px;font-size:12px;font-weight:800}.pill{background:#fff;border:1px solid #d8ccb6;border-radius:999px;padding:5px 8px;white-space:nowrap}
.help{font-size:12px;line-height:1.35;background:#fff8dc;border:1px solid #e4c96d;border-radius:9px;padding:6px 8px;text-align:center}.help strong{color:var(--accent)}
.board{display:grid;grid-template-rows:auto 1fr 1fr;gap:7px;flex:1;min-height:0}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-height:0}
.name-card{position:relative;border:2px solid #c8b99e;background:linear-gradient(#fffdf7,#f3ead8);border-radius:10px;min-width:0;padding:6px 2px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(11px,3.2vw,16px);line-height:1.15;box-shadow:0 2px 3px #0001;touch-action:manipulation}.name-card.ready{border-color:var(--gold);box-shadow:0 0 0 2px #ffe5a5 inset}.name-card.got{background:#dcebdc;border-color:#6b9a70;color:#3b6542}.name-card.got:after{content:"✓";position:absolute;right:3px;top:1px;font-size:14px}.name-card.holding:before{content:"";position:absolute;inset:-2px;border-radius:10px;border:3px solid var(--gold);animation:hold .55s linear forwards}@keyframes hold{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.memory-card{perspective:800px;min-width:0;min-height:0;touch-action:manipulation}.inner{position:relative;width:100%;height:100%;min-height:112px;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.75,.25,1);border-radius:10px}.memory-card.open .inner,.memory-card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 2px 5px #0003}.back{background:linear-gradient(135deg,#29485e,#426e89);border:2px solid #d7c083;display:flex;align-items:center;justify-content:center}.back:before{content:"歴";display:grid;place-items:center;width:54%;aspect-ratio:1;border:2px solid #e8d7a3;border-radius:50%;color:#f2e6c5;font-family:serif;font-size:clamp(22px,8vw,42px);font-weight:900}.front{transform:rotateY(180deg);background:#eee;border:2px solid #fff}.front{display:flex;align-items:center;justify-content:center}.front img{width:100%;height:100%;object-fit:contain;object-position:center center;display:block;background:#e9e3d8}.memory-card.matched{opacity:.2;pointer-events:none;transition:opacity .35s}.memory-card.holding .back:after{content:"";position:absolute;inset:4px;border-radius:7px;border:4px solid #f0d26c;animation:hold .55s linear forwards}
.controls{display:flex;gap:7px}.controls button{flex:1;border:0;border-radius:10px;padding:9px 8px;font-weight:900;font-size:14px;background:#3c342c;color:white}.controls button.secondary{background:#817362}.message{min-height:20px;text-align:center;font-weight:800;font-size:13px;color:#674e34}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.show{display:flex}.panel{width:min(94vw,500px);background:#fffaf0;border-radius:16px;padding:14px;box-shadow:0 15px 40px #0007}.profile{display:grid;grid-template-columns:42% 1fr;gap:12px}.profile img{width:100%;height:190px;object-fit:contain;object-position:center center;border-radius:10px;background:#e9e3d8}.profile h2{margin:0 0 4px;font-size:22px}.reading{font-size:13px;color:#755f4b;font-weight:700;margin-bottom:12px}.desc{font-size:14px;line-height:1.6}.panel button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:11px;background:var(--accent);color:#fff;font-weight:900}.result{text-align:center}.result h2{font-size:26px;margin:4px}.result .big{font-size:42px;font-weight:900;color:var(--accent)}
@media(max-height:720px){.app{gap:4px;padding-top:5px}.help{font-size:10.5px;padding:4px}.board{gap:4px}.row{gap:4px}.inner{min-height:86px}.controls button{padding:6px}.message{font-size:11px;min-height:15px}.title{font-size:17px}.name-card{padding:3px 1px;font-size:11px}}

/* ガクハコ戻る */
.home-back-btn {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 9999;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.88);
  color: #263238;
  border: 1px solid rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
.home-back-btn:hover { background: #fff; }
.home-back-btn:active { transform: scale(0.96); }
@media (max-width: 600px) {
  .home-back-btn {
    top: max(8px, env(safe-area-inset-top));
    left: 8px;
    padding: 7px 10px;
    font-size: 12px;
  }
}

</style>
</head>
<body><a href="/" class="home-back-btn" aria-label="まなびゲームズのトップへ戻る">← まなびゲームズ</a><main class="app">
<header><div class="title">歴史人物 神経衰弱</div><div class="stats"><div class="pill">獲得 <span id="score">0</span>/5</div><div class="pill">ミス <span id="miss">0</span></div></div></header>
<div class="help">下のカードを<strong>長押し</strong>して2枚めくろう。同じ人物なら、上の名前を<strong>長押し</strong>！</div>
<section class="board"><div class="row" id="names"></div><div class="row" id="row1"></div><div class="row" id="row2"></div></section>
<div class="message" id="message">同じ肖像を2枚見つけよう！</div>
<div class="controls"><button id="newGame">新しいゲーム</button><button class="secondary" id="how">遊び方</button></div>
</main>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<script>
const people=[
['聖徳太子','しょうとくたいし','飛鳥時代の政治家。冠位十二階や十七条の憲法を定め、国のしくみを整えました。','images/01_shotoku.jpg'],
['聖武天皇','しょうむてんのう','奈良時代の天皇。国ごとに国分寺を建て、奈良の東大寺に大仏を造らせました。','images/02_shomu.jpg'],
['鑑真','がんじん','唐から日本へ渡った僧。何度も失敗しながら来日し、正しい仏教の戒律を伝えました。','images/03_ganjin.jpg'],
['紫式部','むらさきしきぶ','平安時代の作家。「源氏物語」を書き、貴族の社会や人々の心を描きました。','images/04_murasaki.jpg'],
['藤原道長','ふじわらのみちなが','平安時代の貴族。娘たちを天皇の后にし、摂関政治の最盛期を築きました。','images/05_michinaga.jpg'],
['源頼朝','みなもとのよりとも','鎌倉幕府を開いた武将。武士による政治のしくみを全国に広げました。','images/06_yoritomo.jpg'],
['足利義満','あしかがよしみつ','室町幕府の第3代将軍。南北朝を統一し、明との日明貿易を始めました。','images/07_yoshimitsu.jpg'],
['雪舟','せっしゅう','室町時代の画僧。中国で絵を学び、日本独自の水墨画を大成しました。','images/08_sesshu.jpg'],
['織田信長','おだのぶなが','戦国時代の武将。楽市・楽座などを進め、全国統一を目指しました。','images/09_nobunaga.jpg'],
['豊臣秀吉','とよとみひでよし','全国統一を成しとげた武将。太閤検地や刀狩を行い、社会を整えました。','images/10_hideyoshi.png'],
['徳川家康','とくがわいえやす','関ヶ原の戦いに勝利し、江戸幕府を開いた初代将軍です。','images/11_ieyasu.jpg'],
['徳川家光','とくがわいえみつ','江戸幕府の第3代将軍。参勤交代を制度化し、幕府の支配を強めました。','images/12_iemitsu.jpg'],
['伊能忠敬','いのうただたか','江戸時代に全国を歩いて測量し、非常に正確な日本地図を作りました。','images/13_ino.jpg'],
['杉田玄白','すぎたげんぱく','江戸時代の蘭学者。西洋の医学書を仲間と翻訳し「解体新書」を出版しました。','images/14_sugita.jpg'],
['坂本龍馬','さかもとりょうま','幕末に薩摩藩と長州藩の協力を仲介し、新しい国づくりを目指しました。','images/15_ryoma.jpg'],
['勝海舟','かつかいしゅう','幕末から明治に活躍。西郷隆盛と話し合い、江戸城の無血開城に力を尽くしました。','images/16_katsu.jpg'],
['大久保利通','おおくぼとしみち','明治政府の中心人物。近代的な国づくりを進め、殖産興業などに取り組みました。','images/17_okubo.jpg'],
['伊藤博文','いとうひろぶみ','初代内閣総理大臣。大日本帝国憲法の制定など、近代国家の制度づくりに関わりました。','images/18_ito.jpg'],
['福沢諭吉','ふくざわゆきち','明治時代の思想家・教育者。「学問のすゝめ」を著し、学ぶことの大切さを説きました。','images/19_fukuzawa.jpg'],
['野口英世','のぐちひでよ','細菌学の研究で世界的に活躍した医学者。感染症の研究に生涯をささげました。','images/20_noguchi.jpg']];
const $=s=>document.querySelector(s), shuffle=a=>[...a].sort(()=>Math.random()-.5);
let chosen=[], opened=[], pending=null, score=0, miss=0, lock=false;
function longPress(el,fn){let t,moved=false;const start=e=>{if(lock)return;moved=false;el.classList.add('holding');t=setTimeout(()=>{el.classList.remove('holding');if(!moved)fn(e)},550)};const cancel=()=>{clearTimeout(t);el.classList.remove('holding')};el.addEventListener('pointerdown',start);el.addEventListener('pointerup',cancel);el.addEventListener('pointercancel',cancel);el.addEventListener('pointerleave',cancel);el.addEventListener('pointermove',e=>{if(Math.abs(e.movementX)>5||Math.abs(e.movementY)>5){moved=true;cancel()}});el.addEventListener('contextmenu',e=>e.preventDefault())}
function newGame(){chosen=shuffle(people).slice(0,5);score=miss=0;opened=[];pending=null;lock=false;$('#score').textContent=0;$('#miss').textContent=0;$('#message').textContent='同じ肖像を2枚見つけよう！';renderNames();renderCards()}
function renderNames(){const box=$('#names');box.innerHTML='';shuffle(chosen).forEach(p=>{const d=document.createElement('div');d.className='name-card';d.textContent=p[0];d.dataset.name=p[0];longPress(d,()=>chooseName(p,d));box.appendChild(d)})}
function renderCards(){const deck=shuffle(chosen.flatMap((p,i)=>[{p,id:i+'a'},{p,id:i+'b'}]));['#row1','#row2'].forEach(x=>$(x).innerHTML='');deck.forEach((o,i)=>{const c=document.createElement('div');c.className='memory-card';c.dataset.name=o.p[0];c.innerHTML=`<div class="inner"><div class="face back"></div><div class="face front"><img src="${o.p[3]}" alt="${o.p[0]}"></div></div>`;longPress(c,()=>flip(c,o.p));$(i<5?'#row1':'#row2').appendChild(c)})}
function flip(c,p){if(lock||pending||c.classList.contains('open')||c.classList.contains('matched'))return;c.classList.add('open');opened.push({c,p});if(opened.length===2){lock=true;setTimeout(checkPair,500)}}
function checkPair(){const [a,b]=opened;if(a.p[0]===b.p[0]){pending=a.p;document.querySelectorAll('.name-card').forEach(n=>{if(!n.classList.contains('got'))n.classList.add('ready')});$('#message').textContent='同じ人物！ 上の名前を長押ししよう';lock=false}else{miss++;$('#miss').textContent=miss;$('#message').textContent='ちがう人物。もう一度！';setTimeout(()=>{a.c.classList.remove('open');b.c.classList.remove('open');opened=[];lock=false},700)}}
function chooseName(p,d){if(!pending||d.classList.contains('got'))return;if(p[0]===pending[0]){score++;$('#score').textContent=score;d.classList.add('got');document.querySelectorAll('.name-card').forEach(n=>n.classList.remove('ready'));opened.forEach(x=>x.c.classList.add('matched'));opened=[];pending=null;showProfile(p)}else{miss++;$('#miss').textContent=miss;d.animate([{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}],{duration:220});$('#message').textContent='名前がちがいます。肖像をよく見よう！'}}
function showProfile(p){$('#panel').innerHTML=`<div class="profile"><img src="${p[3]}" alt="${p[0]}"><div><h2>${p[0]}</h2><div class="reading">${p[1]}</div><div class="desc">${p[2]}</div></div></div><button id="closeProfile">つづける</button>`;$('#overlay').classList.add('show');$('#closeProfile').onclick=()=>{$('#overlay').classList.remove('show');if(score===5)setTimeout(showResult,250);else $('#message').textContent='次の同じ肖像を探そう！'}}
function showResult(){let rank=miss===0?'名人！':miss<=2?'すばらしい！':miss<=5?'よくできました！':'クリア！';$('#panel').innerHTML=`<div class="result"><h2>${rank}</h2><div>5人全員を見つけました</div><div class="big">ミス ${miss}回</div><p>もっと少ないミスでクリアできるかな？</p></div><button id="again">もう一度あそぶ</button>`;$('#overlay').classList.add('show');$('#again').onclick=()=>{$('#overlay').classList.remove('show');newGame()}}
$('#newGame').onclick=()=>{if(confirm('新しい5人でやり直しますか？'))newGame()};$('#how').onclick=()=>{$('#panel').innerHTML='<h2>遊び方</h2><div class="desc">① 下の10枚からカードを長押しして2枚めくります。<br>② 同じ肖像がそろったら、上段からその人物の名前を長押しします。<br>③ 正解すると人物を獲得し、紹介が表示されます。<br>④ 5人全員を、できるだけ少ないミスで獲得しましょう。</div><button id="closeHow">とじる</button>';$('#overlay').classList.add('show');$('#closeHow').onclick=()=>$('#overlay').classList.remove('show')};
newGame();
</script></body></html>
