<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>カンジグソーパズル - 試遊版</title>
<style>
  :root{
    --bg1:#e7f6ff;
    --bg2:#f8fff2;
    --ink:#16324a;
    --blue:#2d8cff;
    --green:#4fae4f;
    --cream:#fffaf0;
    --line:#8fb8d7;
    --shadow:0 8px 20px rgba(33,76,112,.14);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2));
  }
  body{display:flex;justify-content:center;overscroll-behavior:none}
  button{font:inherit}
  .app{
    width:min(100%,1180px);height:100vh;height:100dvh;min-height:0;
    padding:8px 9px max(8px,env(safe-area-inset-bottom));
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .home{
    position:absolute;left:8px;top:8px;z-index:20;display:inline-flex;align-items:center;gap:.35em;
    text-decoration:none;color:#25516d;background:#ffffffdf;border:1px solid #c9dce9;
    padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;box-shadow:0 3px 12px rgba(0,0,0,.06)
  }
  .title{
    flex:0 0 auto;margin:0 auto 4px;width:max-content;max-width:70%;padding:6px 14px;
    border:2px solid #f4c96d;border-radius:999px;background:#fffdf7;box-shadow:var(--shadow);
    font-weight:1000;font-size:clamp(20px,6vw,30px);line-height:1.15;letter-spacing:.03em;color:#3b2f27
  }
  .gradeRow{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0}
  .gradeBtn{
    border:1px solid #b9d0df;background:#fff;color:#2477bb;border-radius:999px;padding:7px 1px;
    font-size:13px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.05)
  }
  .gradeBtn.active{background:linear-gradient(#3e9cff,#2379d6);color:white;border-color:#2379d6;box-shadow:0 4px 10px rgba(35,121,214,.22)}
  .status{
    flex:0 0 auto;display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;
    background:#fff9e7;border:1px solid #eddba8;border-radius:14px;padding:6px 8px;margin-bottom:6px;
    box-shadow:0 4px 12px rgba(94,74,33,.07)
  }
  .status strong{font-size:12px;white-space:nowrap}.count{font-size:12px;font-weight:1000;white-space:nowrap}.count b{font-size:19px;color:#ef7a1b}
  .sampleBtn{border:2px solid var(--blue);color:#1971bc;background:white;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}

  .playArea{
    position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .boardWrap{flex:0 0 auto;display:flex;justify-content:center;align-items:center;margin:0;position:relative;z-index:2;min-height:0}
  .board{
    position:relative;width:220px;aspect-ratio:1;background:#fffdf6;border:4px solid #eadab0;border-radius:18px;
    box-shadow:var(--shadow);overflow:visible;flex:0 0 auto
  }
  .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .15s;pointer-events:none;border-radius:13px}
  .ghost.show{opacity:.13}
  .slotLayer{position:absolute;inset:0;overflow:visible;pointer-events:none}
  .slotCanvas{position:absolute;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(255,255,255,.9))}

  .tray{
    position:relative;z-index:1;flex:1 1 auto;min-height:105px;height:auto!important;margin:0;
    background:#f8fff1;border:2px solid #7fbf53;border-radius:18px;box-shadow:var(--shadow);overflow:hidden
  }
  .trayHead{position:absolute;left:8px;right:8px;top:7px;display:flex;align-items:flex-start;justify-content:space-between;gap:6px;pointer-events:none;z-index:5}
  .trayTitle{background:#42a943;color:#fff;border-radius:999px;padding:4px 11px;font-size:14px;line-height:1.2;font-weight:1000}
  .help{font-size:10px;line-height:1.25;color:#347b35;font-weight:800;text-align:right}
  .piece{position:absolute;z-index:10;cursor:grab;touch-action:none;transform-origin:50% 50%;transition:filter .12s, transform .14s;filter:drop-shadow(0 5px 5px rgba(0,0,0,.17))}
  .piece:active{cursor:grabbing;filter:drop-shadow(0 8px 8px rgba(0,0,0,.23))}
  .piece.snapped{z-index:8;filter:none;cursor:default}
  .piece canvas{display:block;width:100%;height:100%}

  .actions{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.25fr;gap:7px;margin-top:6px}
  .actionBtn{border:0;border-radius:999px;padding:8px 7px;font-size:14px;line-height:1.15;font-weight:1000;box-shadow:0 5px 10px rgba(0,0,0,.11);cursor:pointer}
  .resetBtn{background:#fff;color:#1b74c9;border:2px solid #64a7e6}
  .nextBtn{background:linear-gradient(#ffd95b,#ffb92f);color:#5a3800;border:2px solid #f0a31e}
  .tiny{display:none}

  .modal{
    position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:rgba(21,44,61,.42);
    display:none;place-items:center;padding:12px;z-index:100;overflow:hidden
  }
  .modal.show{display:grid}
  .modalCard{
    width:100%;max-width:380px;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:auto;
    background:#fff;border-radius:22px;padding:13px 12px;text-align:center;box-shadow:0 18px 45px rgba(0,0,0,.23);border:3px solid #f1cf62
  }
  .modalCard .big{font-size:50px;line-height:1;margin:3px 0 2px}.modalCard h2{margin:0 0 3px;font-size:23px}.modalCard p{margin:3px 0 9px;color:#4c6575;font-size:12px;line-height:1.35}
  .modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modalCard button{min-width:0;border-radius:999px;padding:8px 7px;font-size:12px;line-height:1.2;font-weight:1000;cursor:pointer}
  .modalSame{background:#fff;color:#1b74c9;border:2px solid #64a7e6}
  .modalNext{background:#2f8ded;color:#fff;border:2px solid #2f8ded}


  .result-pr{
    width:300px;max-width:100%;margin:14px auto 0;padding-top:10px;
    border-top:1px solid #d9e1e6;text-align:center
  }
  .result-pr-head{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:7px;font-size:12px;font-weight:900;color:#526b7a
  }
  .result-pr-head span{
    border:1px solid #9eabb3;border-radius:999px;padding:1px 7px;
    color:#6a7c87;font-size:9px;line-height:1.4
  }
  .a8-rotation-slot{
    width:300px;max-width:100%;height:250px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;overflow:hidden
  }
  .a8-rotation-slot a{display:block;line-height:0}
  .a8-rotation-slot img{
    display:block;max-width:100%;height:auto;margin:0 auto
  }

  @media (max-width:380px){
    .home{font-size:10px;padding:4px 7px}.title{font-size:19px;max-width:72%;padding:5px 11px}
    .gradeBtn{font-size:12px;padding:6px 0}.status{gap:4px;padding:5px 6px}.status strong,.count{font-size:11px}.count b{font-size:17px}
    .sampleBtn{font-size:11px;padding:4px 6px}.help{font-size:9px}.actionBtn{font-size:13px;padding:7px 5px}
  }

  /* PC・タブレット横幅では、盤面を左、ピース置き場を右に分ける */
  @media (min-width:760px){
    .app{padding:14px 18px 12px}
    .home{left:16px;top:14px;font-size:13px;padding:7px 11px}
    .title{margin-bottom:8px;max-width:80%;padding:8px 20px;border-width:3px;font-size:32px}
    .gradeRow{width:min(620px,70%);margin:5px auto 7px;gap:7px}.gradeBtn{font-size:15px;padding:9px 3px}
    .status{width:min(760px,82%);margin:0 auto 10px;padding:8px 11px;border-radius:17px;gap:9px}
    .status strong,.count{font-size:14px}.count b{font-size:22px}.sampleBtn{font-size:14px;padding:6px 10px}
    .playArea{display:grid;grid-template-columns:minmax(330px,430px) minmax(470px,1fr);gap:22px;align-items:stretch}
    .boardWrap{height:100%;align-items:flex-start}
    .board{border-width:5px;border-radius:22px}
    .tray{height:auto!important;min-height:0;border-width:3px;border-radius:22px}
    .trayHead{left:12px;right:12px;top:10px}.trayTitle{padding:6px 16px;font-size:18px}.help{font-size:13px;line-height:1.3}
    .actions{width:min(620px,58%);margin:10px 0 0 auto;gap:10px}.actionBtn{font-size:17px;padding:11px 9px;border-width:3px}
    .tiny{display:block;flex:0 0 auto;margin-top:5px;font-size:10px;color:#66808e;text-align:right}
    .modalCard{max-width:420px;padding:24px 22px}.modalCard .big{font-size:72px}.modalCard h2{font-size:30px}.modalCard p{font-size:14px}.modalCard button{font-size:15px;padding:11px 10px}
  }
</style>
</head>
<body>
<main class="app">
  <a class="home" href="/" aria-label="ガクハコのトップへ戻る">← ガクハコ</a>
  <div class="title">カンジグソーパズル</div>

  <div class="gradeRow" id="gradeRow"></div>
  <section class="status">
    <strong id="gradeLabel">4年生・3×3（全202字）</strong>
    <span class="count">のこり <b id="remain">0</b> ピース</span>
    <button class="sampleBtn" id="sampleBtn">👁 おてほん</button>
  </section>

  <div class="playArea" id="playArea">
    <div class="boardWrap">
      <div class="board" id="board">
        <canvas class="ghost" id="ghost"></canvas>
        <div class="slotLayer" id="slotLayer"></div>
      </div>
    </div>
    <div class="tray" id="tray">
      <div class="trayHead"><span class="trayTitle">ピース</span><span class="help">タップで90°回転<br>ドラッグで移動</span></div>
    </div>
  </div>

  <div class="actions">
    <button class="actionBtn resetBtn" id="resetBtn">↺ やりなおす</button>
    <button class="actionBtn nextBtn" id="nextBtn">つぎの漢字 →</button>
  </div>
  <div class="tiny">※文部科学省「学年別漢字配当表」に基づく全1,026字を収録。</div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="modalCard">
    <h2 id="doneTitle">できた！</h2>
    <div class="big" id="doneKanji">機</div>
    <p>ぜんぶのピースが正しい向き・場所にはまりました。</p>
    <div class="modalActions">
      <button class="modalSame" id="sameModal">同じ漢字でもう一度</button>
      <button class="modalNext" id="nextModal">つぎの漢字 →</button>
    </div>
    <aside class="result-pr" aria-label="保護者向けPR">
      <div class="result-pr-head">保護者の方へ <span>PR</span></div>
      <div class="a8-rotation-slot"></div>
    </aside>
  </div>
</div>

    6: ['胃','異','遺','域','宇','映','延','沿','恩','我','灰','拡','革','閣','割','株','干','巻','看','簡','危','机','揮','貴','疑','吸','供','胸','郷','勤','筋','系','敬','警','劇','激','穴','券','絹','権','憲','源','厳','己','呼','誤','后','孝','皇','紅','降','鋼','刻','穀','骨','困','砂','座','済','裁','策','冊','蚕','至','私','姿','視','詞','誌','磁','射','捨','尺','若','樹','収','宗','就','衆','従','縦','縮','熟','純','処','署','諸','除','承','将','傷','障','蒸','針','仁','垂','推','寸','盛','聖','誠','舌','宣','専','泉','洗','染','銭','善','奏','窓','創','装','層','操','蔵','臓','存','尊','退','宅','担','探','誕','段','暖','値','宙','忠','著','庁','頂','腸','潮','賃','痛','敵','展','討','党','糖','届','難','乳','認','納','脳','派','拝','背','肺','俳','班','晩','否','批','秘','俵','腹','奮','並','陛','閉','片','補','暮','宝','訪','亡','忘','棒','枚','幕','密','盟','模','訳','郵','優','預','幼','欲','翌','乱','卵','覧','裏','律','臨','朗','論']
  };
  const gridByGrade = g => g <= 2 ? 2 : g <= 4 ? 3 : 4;

  const gradeRow = document.getElementById('gradeRow');
  const gradeLabel = document.getElementById('gradeLabel');
  const remainEl = document.getElementById('remain');
  const board = document.getElementById('board');
  const tray = document.getElementById('tray');
  const playArea = document.getElementById('playArea');
  const slotLayer = document.getElementById('slotLayer');
  const ghost = document.getElementById('ghost');
  const modal = document.getElementById('modal');
  const doneKanji = document.getElementById('doneKanji');

  function showRandomResultAd(){
    const slot = document.querySelector('#modal .a8-rotation-slot');
    if(!slot) return;
    const ads = ['result-ad-1','result-ad-2','result-ad-3','result-ad-4','result-ad-5','result-ad-6'];
    slot.replaceChildren();
    const selected = ads[Math.floor(Math.random()*ads.length)];
    const template = document.getElementById(selected);
    if(template) slot.append(template.content.cloneNode(true));
  }

  // 各学年をシャッフルした「出題袋」から1字ずつ取り出す。
  // 同一セッション中は全字を一巡するまで重複しない。
  const drawPools = {};
  const LAST_KEY_PREFIX = 'kanjiguso_last_v3_';

  function shuffleCopy(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function getSavedLast(g){
    try { return localStorage.getItem(LAST_KEY_PREFIX + g) || ''; }
    catch(e){ return ''; }
  }

  function saveLast(g,k){
    try { localStorage.setItem(LAST_KEY_PREFIX + g, k); }
    catch(e){}
  }

  function refillPool(g){
    drawPools[g] = shuffleCopy(kanjiByGrade[g]);
  }

  function drawNextKanji(g, current=''){
    if(!drawPools[g] || drawPools[g].length===0) refillPool(g);

    const avoid = current || getSavedLast(g);
    if(drawPools[g].length > 1 && drawPools[g][drawPools[g].length-1] === avoid){
      // 次に出る1字が直前と同じなら、袋の別位置と交換。
      const swapIndex = Math.floor(Math.random()*(drawPools[g].length-1));
      const lastIndex = drawPools[g].length-1;
      [drawPools[g][swapIndex], drawPools[g][lastIndex]] =
        [drawPools[g][lastIndex], drawPools[g][swapIndex]];
    }

    let next = drawPools[g].pop();

    // 一巡直後の境目でも同じ字が連続しないよう保険。
    if(next === avoid && kanjiByGrade[g].length > 1){
      if(drawPools[g].length===0) refillPool(g);
      const alt = drawPools[g].pop();
      drawPools[g].push(next);
      next = alt;
    }

    saveLast(g,next);
    return next;
  }

  let grade = 4;
  let kanji = drawNextKanji(grade);
  let grid = gridByGrade(grade);
  let pieces = [];
  let edgeV = [], edgeH = [];
  let sourceCanvas = null;
  let sourceSize = 900;
  let resizeTimer = null;

  for(let g=1; g<=6; g++){
    const b = document.createElement('button');
    b.className='gradeBtn';
    b.textContent=g+'年';
    b.dataset.grade=g;
    b.addEventListener('click',()=>{
      grade=g; grid=gridByGrade(g); kanji=drawNextKanji(g); renderGrades(); buildPuzzle();
    });
    gradeRow.appendChild(b);
  }

  function renderGrades(){
    [...gradeRow.children].forEach(b=>b.classList.toggle('active', +b.dataset.grade===grade));
    gradeLabel.textContent = `${grade}年生・${grid}×${grid}（全${kanjiByGrade[grade].length}字）`;
  }

  function isMobileLayout(){
    return window.matchMedia('(max-width: 759px)').matches;
  }

  function setResponsiveBoardSize(){
    const mobile = isMobileLayout();
    let size;
    if(mobile){
      const byGrid = grid===2 ? 190 : (grid===3 ? 218 : 232);
      const byHeight = Math.max(152, Math.min(238, window.innerHeight * 0.285));
      const byWidth = Math.max(152, window.innerWidth - 68);
      size = Math.min(byGrid, byHeight, byWidth);
    }else{
      const byGrid = grid===2 ? 300 : (grid===3 ? 330 : 360);
      const byHeight = Math.max(270, playArea.clientHeight - 24);
      size = Math.min(byGrid, byHeight);
    }
    board.style.width = Math.round(size) + 'px';
  }

  function chooseDifferentKanji(){
    kanji = drawNextKanji(grade, kanji);
  }

  function makeSource(){
    sourceCanvas = document.createElement('canvas');
    sourceCanvas.width = sourceCanvas.height = sourceSize;
    const ctx = sourceCanvas.getContext('2d');
    ctx.clearRect(0,0,sourceSize,sourceSize);
    // 余白を持たせて字形全体が収まるようにする。
    const fontSize = sourceSize * (grid===4 ? 0.72 : 0.76);
    ctx.fillStyle = '#142029';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font=`900 ${fontSize}px "Noto Sans JP","Yu Gothic","Meiryo",sans-serif`;
    ctx.fillText(kanji, sourceSize/2, sourceSize/2 + sourceSize*0.015);

    const gctx = ghost.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const s = board.clientWidth;
    ghost.width = ghost.height = Math.round(s*dpr);
    ghost.style.width = ghost.style.height = s+'px';
    gctx.setTransform(dpr,0,0,dpr,0,0);
    gctx.clearRect(0,0,s,s);
    gctx.drawImage(sourceCanvas,0,0,s,s);
  }

  function randomEdges(){
    edgeV = Array.from({length:grid},()=>Array(grid-1).fill(0));
    edgeH = Array.from({length:grid-1},()=>Array(grid).fill(0));
    for(let r=0;r<grid;r++) for(let c=0;c<grid-1;c++) edgeV[r][c] = Math.random()<.5 ? 1 : -1;
    for(let r=0;r<grid-1;r++) for(let c=0;c<grid;c++) edgeH[r][c] = Math.random()<.5 ? 1 : -1;
  }

  // side sign: 0=flat, +1=tab outward, -1=hole inward
  function edgeSigns(r,c){
    return {
      top: r===0 ? 0 : -edgeH[r-1][c],
      right: c===grid-1 ? 0 : edgeV[r][c],
      bottom: r===grid-1 ? 0 : edgeH[r][c],
      left: c===0 ? 0 : -edgeV[r][c-1]
    };
  }

  function jigsawPath(ctx, cell, margin, signs){
    const x0=margin, y0=margin, x1=margin+cell, y1=margin+cell;
    const neck=cell*0.17, tab=cell*0.22;
    ctx.beginPath(); ctx.moveTo(x0,y0);

    // top: left -> right, outward is negative y
    ctx.lineTo(x0+cell*.34,y0);
    if(signs.top){
      const s=signs.top;
      ctx.bezierCurveTo(x0+cell*.39,y0, x0+cell*.39,y0-s*tab, x0+cell*.50-neck,y0-s*tab);
      ctx.bezierCurveTo(x0+cell*.50-neck*.25,y0-s*tab*1.08, x0+cell*.50+neck*.25,y0-s*tab*1.08, x0+cell*.50+neck,y0-s*tab);
      ctx.bezierCurveTo(x0+cell*.61,y0-s*tab, x0+cell*.61,y0, x0+cell*.66,y0);
    }
    ctx.lineTo(x1,y0);

    // right: top -> bottom, outward is +x
    ctx.lineTo(x1,y0+cell*.34);
    if(signs.right){
      const s=signs.right;
      ctx.bezierCurveTo(x1,y0+cell*.39, x1+s*tab,y0+cell*.39, x1+s*tab,y0+cell*.50-neck);
      ctx.bezierCurveTo(x1+s*tab*1.08,y0+cell*.50-neck*.25, x1+s*tab*1.08,y0+cell*.50+neck*.25, x1+s*tab,y0+cell*.50+neck);
      ctx.bezierCurveTo(x1+s*tab,y0+cell*.61, x1,y0+cell*.61, x1,y0+cell*.66);
    }
    ctx.lineTo(x1,y1);

    // bottom: right -> left, outward is +y
    ctx.lineTo(x0+cell*.66,y1);
    if(signs.bottom){
      const s=signs.bottom;
      ctx.bezierCurveTo(x0+cell*.61,y1, x0+cell*.61,y1+s*tab, x0+cell*.50+neck,y1+s*tab);
      ctx.bezierCurveTo(x0+cell*.50+neck*.25,y1+s*tab*1.08, x0+cell*.50-neck*.25,y1+s*tab*1.08, x0+cell*.50-neck,y1+s*tab);
      ctx.bezierCurveTo(x0+cell*.39,y1+s*tab, x0+cell*.39,y1, x0+cell*.34,y1);
    }
    ctx.lineTo(x0,y1);

    // left: bottom -> top, outward is -x
    ctx.lineTo(x0,y0+cell*.66);
    if(signs.left){
      const s=signs.left;
      ctx.bezierCurveTo(x0,y0+cell*.61, x0-s*tab,y0+cell*.61, x0-s*tab,y0+cell*.50+neck);
      ctx.bezierCurveTo(x0-s*tab*1.08,y0+cell*.50+neck*.25, x0-s*tab*1.08,y0+cell*.50-neck*.25, x0-s*tab,y0+cell*.50-neck);
      ctx.bezierCurveTo(x0-s*tab,y0+cell*.39, x0,y0+cell*.39, x0,y0+cell*.34);
    }
    ctx.lineTo(x0,y0); ctx.closePath();
  }

  function cellInkRatio(r,c){
    const cell = sourceSize/grid;
    const ctx = sourceCanvas.getContext('2d');
    const pad = cell*.06;
    const d = ctx.getImageData(Math.max(0,c*cell-pad), Math.max(0,r*cell-pad), Math.min(sourceSize-(c*cell-pad),cell+pad*2), Math.min(sourceSize-(r*cell-pad),cell+pad*2)).data;
    let ink=0,total=d.length/4;
    for(let i=3;i<d.length;i+=4) if(d[i]>30) ink++;
    return ink/total;
  }

  function drawPieceCanvas(r,c,cellPx,marginPx,signs,slot=false){
    const dpr=window.devicePixelRatio||1;
    const size=cellPx+marginPx*2;
    const cvs=document.createElement('canvas');
    cvs.width=cvs.height=Math.ceil(size*dpr);
    cvs.style.width=cvs.style.height=size+'px';
    const ctx=cvs.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,size,size);
    jigsawPath(ctx,cellPx,marginPx,signs);

    if(slot){
      ctx.fillStyle='rgba(255,255,255,.34)';
      ctx.fill();
      ctx.strokeStyle='rgba(90,145,180,.48)';
      ctx.lineWidth=Math.max(1.5,cellPx*.018);
      ctx.setLineDash([cellPx*.07,cellPx*.055]);
      ctx.stroke();
      return cvs;
    }

    ctx.save();
    jigsawPath(ctx,cellPx,marginPx,signs);
    ctx.clip();
    // piece background
    ctx.fillStyle='#fffdf7'; ctx.fillRect(0,0,size,size);
    const scale=(cellPx*grid)/sourceSize;
    const full=cellPx*grid;
    ctx.drawImage(sourceCanvas, marginPx-c*cellPx, marginPx-r*cellPx, full, full);
    ctx.restore();

    jigsawPath(ctx,cellPx,marginPx,signs);
    ctx.strokeStyle='#d7c8a3'; ctx.lineWidth=Math.max(1.4,cellPx*.018); ctx.setLineDash([]); ctx.stroke();
    return cvs;
  }

  function buildPuzzle(){
    document.querySelectorAll('.piece').forEach(el=>el.remove());
    slotLayer.innerHTML=''; pieces=[]; modal.classList.remove('show'); ghost.classList.remove('show');
    renderGrades();
    setResponsiveBoardSize();
    requestAnimationFrame(()=>{
      makeSource(); randomEdges();
      const boardRect=board.getBoundingClientRect();
      const playRect=playArea.getBoundingClientRect();
      const boardSize=board.clientWidth;
      const cell=boardSize/grid;
      const margin=cell*.25;

      const movable=[];
      let fixedCount=0;
      for(let r=0;r<grid;r++){
        for(let c=0;c<grid;c++){
          const signs=edgeSigns(r,c);
          const slotC=drawPieceCanvas(r,c,cell,margin,signs,true);
          slotC.className='slotCanvas';
          slotC.style.width=slotC.style.height=(cell+margin*2)+'px';
          slotC.style.left=(c*cell-margin)+'px';
          slotC.style.top=(r*cell-margin)+'px';
          slotLayer.appendChild(slotC);

          const ink=cellInkRatio(r,c);
          // 実線がほぼないピースは開始時から固定。高学年では閾値を少し厳しめに。
          const blankish = ink < (grid===4 ? 0.008 : 0.006);
          const p = {r,c,signs,rotation:0,snapped:blankish,el:null,targetX:0,targetY:0};
          pieces.push(p);
          if(blankish){
            fixedCount++;
            const el=document.createElement('div'); el.className='piece snapped'; el.dataset.r=r; el.dataset.c=c;
            const pc=drawPieceCanvas(r,c,cell,margin,signs,false);
            el.appendChild(pc);
            el.style.width=el.style.height=(cell+margin*2)+'px';
            el.style.left=(boardRect.left-playRect.left + c*cell-margin)+'px';
            el.style.top=(boardRect.top-playRect.top + r*cell-margin)+'px';
            el.style.opacity='.72';
            p.el=el; p.targetX=parseFloat(el.style.left); p.targetY=parseFloat(el.style.top);
            playArea.appendChild(el);
          } else movable.push(p);
        }
      }

      // 画面内に必ず収めるため、トレーの「現在の実寸」に合わせて並べる。
      // スマホは縦方向を強めに重ね、PCは右側トレーへゆったり配置する。
      const pieceSize=cell+margin*2;
      const mobile=isMobileLayout();
      const cols = grid===2 ? 2 : (grid===3 ? 3 : 4);
      const rows = Math.max(1, Math.ceil(movable.length/cols));
      const trayRect=tray.getBoundingClientRect();
      const usableW = Math.max(pieceSize, tray.clientWidth-20);
      const headerH = mobile ? 38 : 58;
      const usableH = Math.max(pieceSize*.62, tray.clientHeight-headerH-8);
      const gapX = cols<=1 ? 0 : Math.max(0,(usableW-pieceSize)/(cols-1));
      const gapY = rows<=1 ? 0 : Math.max(0,Math.min(pieceSize*(mobile?.78:.66),(usableH-pieceSize)/(rows-1)));
      const startY = (trayRect.top-playRect.top)+headerH;
      movable.sort(()=>Math.random()-.5).forEach((p,i)=>{
        const el=document.createElement('div'); el.className='piece'; el.dataset.r=p.r; el.dataset.c=p.c;
        const pc=drawPieceCanvas(p.r,p.c,cell,margin,p.signs,false); el.appendChild(pc);
        el.style.width=el.style.height=pieceSize+'px';
        const col=i%cols,row=Math.floor(i/cols);
        const jitterX=(Math.random()-.5)*Math.min(mobile?8:16,cell*.11);
        const jitterY=(Math.random()-.5)*Math.min(mobile?5:12,cell*.09);
        const x=(trayRect.left-playRect.left)+10+col*gapX+jitterX;
        const y=startY+row*gapY+jitterY;
        el.style.left=x+'px'; el.style.top=y+'px';
        p.rotation=[0,90,180,270][Math.floor(Math.random()*4)];
        el.style.transform=`rotate(${p.rotation}deg)`;
        p.el=el;
        p.targetX=(boardRect.left-playRect.left)+p.c*cell-margin;
        p.targetY=(boardRect.top-playRect.top)+p.r*cell-margin;
        bindDrag(p,cell,margin);
        playArea.appendChild(el);
      });
      updateRemain();
    });
  }

  function bindDrag(p,cell,margin){
    const el=p.el; let sx=0,sy=0,ox=0,oy=0,moved=0,pointerId=null;
    el.addEventListener('pointerdown',e=>{
      if(p.snapped) return;
      pointerId=e.pointerId; el.setPointerCapture(pointerId);
      sx=e.clientX; sy=e.clientY; ox=parseFloat(el.style.left); oy=parseFloat(el.style.top); moved=0;
      el.style.transition='filter .12s'; el.style.zIndex=30;
    });
    el.addEventListener('pointermove',e=>{
      if(pointerId!==e.pointerId || p.snapped) return;
      const dx=e.clientX-sx,dy=e.clientY-sy; moved=Math.max(moved,Math.hypot(dx,dy));
      el.style.left=(ox+dx)+'px'; el.style.top=(oy+dy)+'px';
    });
    el.addEventListener('pointerup',e=>{
      if(pointerId!==e.pointerId || p.snapped) return;
      el.releasePointerCapture(pointerId); pointerId=null; el.style.zIndex=10;
      if(moved<8){
        p.rotation=(p.rotation+90)%360;
        el.style.transition='transform .14s, filter .12s';
        el.style.transform=`rotate(${p.rotation}deg)`;
        return;
      }
      const x=parseFloat(el.style.left), y=parseFloat(el.style.top);
      const dist=Math.hypot(x-p.targetX,y-p.targetY);
      if(dist < cell*.35 && p.rotation%360===0){
        p.snapped=true;
        el.classList.add('snapped');
        el.style.transition='left .14s, top .14s, transform .14s';
        el.style.left=p.targetX+'px'; el.style.top=p.targetY+'px'; el.style.transform='rotate(0deg)';
        updateRemain();
        if(pieces.every(q=>q.snapped)) setTimeout(showDone,220);
      }
    });
    el.addEventListener('pointercancel',()=>{pointerId=null;});
  }

  function updateRemain(){ remainEl.textContent=pieces.filter(p=>!p.snapped).length; }
  function showDone(){ doneKanji.textContent=kanji; showRandomResultAd(); modal.classList.add('show'); }

  document.getElementById('sampleBtn').addEventListener('pointerdown',()=>ghost.classList.add('show'));
  document.getElementById('sampleBtn').addEventListener('pointerup',()=>ghost.classList.remove('show'));
  document.getElementById('sampleBtn').addEventListener('pointerleave',()=>ghost.classList.remove('show'));
  document.getElementById('sampleBtn').addEventListener('click',()=>{
    ghost.classList.add('show'); setTimeout(()=>ghost.classList.remove('show'),900);
  });
  document.getElementById('resetBtn').addEventListener('click',buildPuzzle);
  document.getElementById('nextBtn').addEventListener('click',()=>{ chooseDifferentKanji(); buildPuzzle(); });
  document.getElementById('sameModal').addEventListener('click',()=>{ modal.classList.remove('show'); buildPuzzle(); });
  document.getElementById('nextModal').addEventListener('click',()=>{ modal.classList.remove('show'); chooseDifferentKanji(); buildPuzzle(); });

  window.addEventListener('resize',()=>{clearTimeout(resizeTimer); resizeTimer=setTimeout(buildPuzzle,220);});

  renderGrades();
  buildPuzzle();
})();
</script>
</body>
