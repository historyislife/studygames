<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>都道府県 比較クイズ</title>


<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#142033;--muted:#687386;--line:#e4e8f0;--blue:#2563eb;--blue-soft:#eaf1ff;--purple:#7c3aed;--purple-soft:#f2ebff;--ok:#16803a;--ok-soft:#edf9f0;--ng:#b42318;--ng-soft:#fff0ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif}
body{min-height:100dvh}
button{font:inherit}
.app{width:100%;max-width:520px;height:100dvh;margin:0 auto;padding:5px 7px 7px;display:flex;flex-direction:column;overflow:hidden}
.header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:1px 0 4px}
.header h1{margin:0 0 0 125px;font-size:16px;line-height:1.05;font-weight:900}
.subtitle{font-size:8px;color:var(--muted);margin-top:1px}
.badge{flex:0 0 auto;padding:4px 7px;border-radius:999px;background:var(--blue-soft);color:#1d4ed8;font-size:9px;font-weight:900}
.panel{flex:1 1 auto;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:7px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 5px 15px rgba(20,32,51,.05)}
.levels{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:4px}
.level{appearance:none;border:2px solid var(--line);background:#fafbfc;border-radius:10px;padding:5px 4px;text-align:center;color:var(--text);min-height:38px}
.level strong{display:block;font-size:12px;line-height:1.05}
.level small{display:block;font-size:7px;line-height:1.15;color:var(--muted);margin-top:1px}
.level.active{border-color:var(--blue);background:var(--blue-soft)}
.level[data-level="advanced"].active{border-color:var(--purple);background:var(--purple-soft)}
.settings{flex:0 0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 0 3px;margin:0;scrollbar-width:none;min-height:25px}
.settings::-webkit-scrollbar{display:none}
.typebtn{flex:0 0 auto;appearance:none;border:0;border-radius:999px;padding:5px 8px;background:#eef1f5;color:#475467;font-size:9px;font-weight:800;line-height:1}
.typebtn.active{background:#dbe7ff;color:#1d4ed8}
.advanced .typebtn.active{background:#ede4ff;color:#6d28d9}
#game{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.stats{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted);font-weight:800;padding:0 1px 2px}
.category{flex:0 0 auto;font-size:9px;font-weight:900;color:var(--blue);margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advanced .category{color:var(--purple)}
.question{flex:0 0 auto;font-size:clamp(17px,5vw,22px);font-weight:900;line-height:1.2;margin:0 0 5px}
.options{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.option{width:100%;min-height:45px;border:2px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--text);font-size:14px;font-weight:900;padding:6px 4px;text-align:center;line-height:1.1}
.option:active{transform:scale(.99)}
.option.correct{border-color:#79c58c;background:var(--ok-soft);color:var(--ok)}
.option.wrong{border-color:#f2aaa3;background:var(--ng-soft);color:var(--ng)}
.option:disabled{opacity:1}
.feedback{flex:0 0 auto;display:none;margin-top:5px;padding:6px 7px;border-radius:9px;background:#f7f8fa;border:1px solid #eceff3;max-height:78px;overflow:hidden}
.feedback.show{display:block}
.feedback strong{display:block;font-size:12px;margin-bottom:2px;line-height:1.1}
.detail{font-size:9px;line-height:1.25;color:#475467}
.sourceLine{display:block;font-size:7px;line-height:1.15;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{flex:0 0 auto;display:none;width:100%;margin-top:5px;min-height:35px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:13px;font-weight:900}
.next.show{display:block}
.advanced .next{background:var(--purple)}
.note{flex:0 0 auto;margin-top:4px;padding:4px 5px;border-radius:8px;background:#f8fafc;color:var(--muted);font-size:6.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.result .big{font-size:40px;font-weight:900;color:var(--blue);line-height:1}
.advanced .result .big{color:var(--purple)}
.result p{font-size:11px;margin:6px 0}
.restart{width:100%;min-height:38px;border:0;border-radius:10px;background:var(--blue);color:white;font-size:13px;font-weight:900}
.advanced .restart{background:var(--purple)}
@media(max-width:600px){.header h1{margin-left:118px}}@media(max-height:680px){
  .header h1{font-size:14px}.subtitle{display:none}.level{min-height:32px;padding:3px}.level small{display:none}
  .settings{min-height:22px}.question{font-size:16px;margin-bottom:4px}.option{min-height:40px;font-size:13px}
  .feedback{max-height:66px;padding:5px}.next{min-height:32px}.note{display:none}
}

/* まなびゲームズへ戻る */
.home-back-btn{position:fixed;top:10px;left:10px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.88);color:#263238;border:1px solid rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-size:13px;font-weight:700;line-height:1;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.12);-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
.home-back-btn:hover{background:#fff}.home-back-btn:active{transform:scale(.96)}
@media(max-width:600px){.home-back-btn{top:max(8px,env(safe-area-inset-top));left:8px;padding:7px 10px;font-size:12px}}
</style>


</head>

</div>

  areaLess:{group:"area",label:"面積",text:b=>`${b.name}より面積が狭い都道府県は？`,value:p=>p.area,valid:(x,b)=>x.area<b.area},
  north:{group:"position",label:"位置・北",text:b=>`${b.name}より北にある都道府県は？`,value:p=>p.lat,valid:(x,b)=>x.lat>b.lat},
  south:{group:"position",label:"位置・南",text:b=>`${b.name}より南にある都道府県は？`,value:p=>p.lat,valid:(x,b)=>x.lat<b.lat},
  east:{group:"position",label:"位置・東",text:b=>`${b.name}より東にある都道府県は？`,value:p=>p.lng,valid:(x,b)=>x.lng>b.lng},
  west:{group:"position",label:"位置・西",text:b=>`${b.name}より西にある都道府県は？`,value:p=>p.lng,valid:(x,b)=>x.lng<b.lng}
};

const ADV_GROUPS = {
  all:"全部", grain:"穀物", vegetable:"野菜", fruit:"果物", fish:"魚介", livestock:"畜産"
};
const ADV_KEYS = {
  grain:["rice","wheat"],
  vegetable:["cabbage","onion","tomato"],
  fruit:["mikan","apple","grape"],
  fish:["sardine","mackerel","yellowtail"],
  livestock:["chicken","pork","beef","eggs","milk"]
};
const KEY_GROUP = Object.fromEntries(Object.entries(ADV_KEYS).flatMap(([g,ks])=>ks.map(k=>[k,g])));

let level="basic", mode="all", qNo=0, score=0, answered=false, current=null;
const TOTAL=10;
const $=s=>document.querySelector(s);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const fmt=n=>Number(n).toLocaleString("ja-JP");

function setSettings() {
  const box=$("#settings");
  box.innerHTML="";
  if(level==="basic") {
    const opts=[["all","全部"],["population","人口"],["area","面積"],["position","東西南北"]];
    opts.forEach(([k,label],i)=>{
      const b=document.createElement("button"); b.className="typebtn"+(i===0?" active":""); b.textContent=label; b.dataset.mode=k;
      b.onclick=()=>changeMode(k,b); box.appendChild(b);
    });
    $("#note").innerHTML=`人口：2025年国勢調査／面積：国土地理院／位置：県庁所在地`;
  } else {
    Object.entries(ADV_GROUPS).forEach(([k,label],i)=>{
      const b=document.createElement("button"); b.className="typebtn"+(i===0?" active":""); b.textContent=label; b.dataset.mode=k;
      b.onclick=()=>changeMode(k,b); box.appendChild(b);
    });
    $("#note").innerHTML=`農水省・水産庁統計。基準県は各品目上位10県。`;
  }
}

function changeMode(k,b) {
  mode=k; qNo=0; score=0;
  document.querySelectorAll(".typebtn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  resetGameDOM(); render();
}

function resetGameDOM() {
  $("#game").innerHTML=`<div class="stats"><span id="progress"></span><span id="score"></span></div>
  <div class="category" id="category"></div><div class="question" id="question"></div>
  <div class="options" id="options"></div><div class="feedback" id="feedback"></div>
  <button class="next" id="next">次の問題</button>`;
  $("#next").onclick=nextQuestion;
}

function basicPoolTypes() {
  return Object.entries(BASIC_TYPES).filter(([k,t])=>mode==="all" || t.group===mode);
}

function makeBasic() {
  for(let tries=0;tries<300;tries++) {
    const pool=basicPoolTypes(); const [key,t]=pool[Math.floor(Math.random()*pool.length)];
    const base=prefectures[Math.floor(Math.random()*prefectures.length)];
    const others=prefectures.filter(p=>p!==base);
    const pos=others.filter(p=>t.valid(p,base)), neg=others.filter(p=>!t.valid(p,base));
    if(!pos.length||neg.length<3) continue;
    const dist=p=>Math.abs(t.value(p)-t.value(base));
    pos.sort((a,b)=>dist(a)-dist(b)); neg.sort((a,b)=>dist(a)-dist(b));
    const correct=pos[Math.floor(Math.random()*Math.min(8,pos.length))];
    const distractors=shuffle(neg.slice(0,Math.min(14,neg.length))).slice(0,3);
    return {kind:"basic",key,t,base,correct,choices:shuffle([correct,...distractors])};
  }
}

function advKeyPool() {
  if(mode==="all") return Object.keys(appliedData);
  return ADV_KEYS[mode] || Object.keys(appliedData);
}

function makeAdvanced() {
  for(let tries=0;tries<300;tries++) {
    const keys=advKeyPool(), key=keys[Math.floor(Math.random()*keys.length)], d=appliedData[key];
    const rows=d.rows.filter(r=>typeof r.value==="number");
    if(rows.length<4) continue;

    // 応用編では基準となる都道府県を、その品目の生産量上位10都道府県に限定
    // これにより、知名度の低い少量生産県同士の比較ばかりになるのを防ぐ
    const ranked=[...rows].sort((a,b)=>b.value-a.value);
    const basePool=ranked.slice(0,Math.min(10,ranked.length));
    const base=basePool[Math.floor(Math.random()*basePool.length)];

    const direction=Math.random()<.5?"more":"less";
    const pos=rows.filter(r=>r.name!==base.name && (direction==="more"?r.value>base.value:r.value<base.value));
    const neg=rows.filter(r=>r.name!==base.name && !(direction==="more"?r.value>base.value:r.value<base.value));
    if(!pos.length||neg.length<3) continue;
    const dist=r=>Math.abs(r.value-base.value);
    pos.sort((a,b)=>dist(a)-dist(b)); neg.sort((a,b)=>dist(a)-dist(b));
    const correct=pos[Math.floor(Math.random()*Math.min(6,pos.length))];
    const distractors=shuffle(neg.slice(0,Math.min(12,neg.length))).slice(0,3);
    return {kind:"advanced",key,d,base,direction,correct,choices:shuffle([correct,...distractors])};
  }
}

function render() {
  answered=false; current=level==="basic"?makeBasic():makeAdvanced();
  $("#progress").textContent=`${qNo+1} / ${TOTAL}`;
  $("#score").textContent=`正解 ${score}`;
  $("#feedback").className="feedback"; $("#feedback").innerHTML="";
  $("#next").className="next"; $("#options").innerHTML="";
  if(current.kind==="basic") {
    $("#category").textContent=`基礎編 ｜ ${current.t.label}`;
    $("#question").textContent=current.t.text(current.base);
  } else {
    const group=ADV_GROUPS[KEY_GROUP[current.key]];
    $("#category").textContent=`応用編 ｜ ${group} ｜ ${current.d.item}`;
    $("#question").textContent=`${current.base.name}より${current.d.item}の${current.d.metric}が${current.direction==="more"?"多い":"少ない"}都道府県は？`;
  }
  current.choices.forEach(p=>{
    const b=document.createElement("button"); b.className="option"; b.textContent=p.name;
    b.onclick=()=>answer(p,b); $("#options").appendChild(b);
  });
}

function basicValueText(p,key) {
  if(key.startsWith("pop")) return fmt(p.population)+"人";
  if(key.startsWith("area")) return p.area.toLocaleString("ja-JP",{minimumFractionDigits:2,maximumFractionDigits:2})+"km²";
  if(key==="north"||key==="south") return `県庁所在地 ${p.capital}：北緯 ${p.lat.toFixed(3)}°`;
  return `県庁所在地 ${p.capital}：東経 ${p.lng.toFixed(3)}°`;
}

function answer(p,button) {
  if(answered) return; answered=true;
  const ok=p===current.correct; if(ok) score++;
  [...document.querySelectorAll(".option")].forEach((b,i)=>{
    b.disabled=true; const target=current.choices[i];
    if(target===current.correct) b.classList.add("correct"); else if(b===button) b.classList.add("wrong");
  });
  const f=$("#feedback"); f.className="feedback show";
  if(current.kind==="basic") {
    f.innerHTML=`<strong>${ok?"正解！":"残念！ 正解は "+current.correct.name}</strong>
      <div class="detail">${current.base.name}：${basicValueText(current.base,current.key)}<br>
      ${current.correct.name}：${basicValueText(current.correct,current.key)}
      ${current.t.group==="position"?"<br><small>※都道府県庁所在地で比較</small>":""}</div>`;
  } else {
    f.innerHTML=`<strong>${ok?"正解！":"残念！ 正解は "+current.correct.name}</strong>
      <div class="detail">${current.base.name}：${fmt(current.base.value)} ${current.d.unit}<br>
      ${current.correct.name}：${fmt(current.correct.value)} ${current.d.unit}<br>
      <span class="sourceLine">${current.d.year} ｜ ${current.d.metric}<br>出典：${current.d.source}</span></div>`;
  }
  $("#score").textContent=`正解 ${score}`; $("#next").className="next show";
  $("#next").textContent=qNo===TOTAL-1?"結果を見る":"次の問題";
}

function nextQuestion() {
  qNo++; if(qNo>=TOTAL) showResult(); else render();
}

function showResult() {
  $("#game").innerHTML=`<div class="result"><div style="font-weight:800;color:#667085">${level==="basic"?"基礎編":"応用編"} 10問終了</div>
    <div class="big">${score} / ${TOTAL}</div>
    <p>${score>=9?"都道府県博士級！":score>=7?"かなり詳しいです！":score>=5?"いい調子です！":"もう一度挑戦して覚えよう！"}</p>
    <button class="restart" id="again">もう一度</button></div>`;
  $("#again").onclick=()=>{qNo=0;score=0;resetGameDOM();render();};
}

document.querySelectorAll(".level").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".level").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    level=b.dataset.level; mode="all"; qNo=0; score=0;
    $("#app").className="app "+(level==="advanced"?"advanced":"");
    $("#badge").textContent=level==="basic"?"基礎編":"応用編";
    setSettings(); resetGameDOM(); render();
  };
});

setSettings(); resetGameDOM(); render();
</script>
</body>
</html>
