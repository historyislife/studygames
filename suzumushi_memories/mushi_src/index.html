<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>スズムシメモリーズ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f3f0df;color:#24301f;font-family:"Noto Sans JP","Yu Gothic",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:10px 10px 30px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.title{font-weight:900;font-size:clamp(20px,5.6vw,32px);letter-spacing:.03em}.stats{white-space:nowrap;font-weight:800;background:#fff;border:2px solid #6d7f49;border-radius:12px;padding:7px 10px}.guide{background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:13px;line-height:1.45;box-shadow:0 2px 8px #0001}.sectionTitle{font-size:12px;font-weight:900;margin:8px 2px 5px;color:#53623b}.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.pick{min-width:0;height:64px;border:2px solid #8a956d;border-radius:10px;background:#fff;padding:4px 2px;font-weight:800;font-size:clamp(10px,2.7vw,14px);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;position:relative;overflow:hidden}.pick.sound{height:58px;font-size:clamp(9px,2.5vw,13px)}.pick.done{opacity:.28}.pick.target{outline:3px solid #d49b28;animation:pulse 1s infinite}@keyframes pulse{50%{transform:translateY(-2px)}}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}.card{aspect-ratio:.78;position:relative;border-radius:10px;isolation:isolate}.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px #0003;transition:transform .2s ease,opacity .16s ease;transform-origin:center;will-change:transform,opacity}.back{background:repeating-linear-gradient(45deg,#405d37 0 9px,#527548 9px 18px);border:3px solid #f5e7a8;display:flex;align-items:center;justify-content:center;transform:scaleX(1);opacity:1;z-index:2}.back:after{content:"♪";font-size:clamp(22px,7vw,40px);font-weight:900;color:#f5e7a8}.front{background:#fff;border:2px solid #697e54;transform:scaleX(.04);opacity:0;z-index:1}.card.flipped .back,.card.matched .back{transform:scaleX(.04);opacity:0;pointer-events:none}.card.flipped .front,.card.matched .front{transform:scaleX(1);opacity:1;z-index:3}.front img{display:block;width:100%;height:100%;object-fit:contain;background:#fff;padding:2px;image-rendering:auto}.front img.fit-contain{object-fit:contain;background:#fff;padding:2px}.card.matched{opacity:.22;pointer-events:none}.resultOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(23,32,14,.78);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:12000}.resultOverlay.show{display:flex}.result{display:flex;background:#fff;border:3px solid #738452;border-radius:18px;padding:12px;gap:12px;align-items:stretch;box-shadow:0 12px 34px #0006;width:min(92vw,620px);max-height:min(86vh,680px);overflow:auto;animation:pop .24s ease-out}.result img{width:40%;max-width:220px;min-height:180px;object-fit:contain;background:#f7f5e9;border-radius:12px;align-self:center}.bio{flex:1;min-width:0}.bio h2{font-size:clamp(20px,5vw,28px);margin:2px 0 3px}.reading{font-size:12px;font-weight:600}.cry{font-size:clamp(17px,4.4vw,23px);font-weight:900;color:#7b4e14;margin:7px 0}.listen{border:0;border-radius:10px;padding:10px 12px;background:#e9f0d9;color:#30421f;font-weight:900;font-size:14px;cursor:pointer;margin:1px 0 6px}.listen:active{transform:scale(.97)}.audioNote{font-size:10px;color:#68705f;margin-bottom:6px}.desc{font-size:13px;line-height:1.55}.next{width:100%;border:0;border-radius:10px;padding:11px;background:#637a45;color:white;font-weight:900;font-size:16px;margin-top:9px}@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}.overlay{position:fixed;inset:0;background:#17200ed9;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.show{display:flex}.finish{background:#fff;border-radius:20px;padding:22px;max-width:390px;width:100%;text-align:center}.finish h2{font-size:28px;margin:0 0 8px}.finish .big{font-size:22px;font-weight:900}.finish button{border:0;background:#637a45;color:#fff;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:900;margin-top:12px}.holdbar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#f2bd43}.holding .holdbar{animation:hold .55s linear forwards}@keyframes hold{to{width:100%}}@media(max-width:430px){.app{padding:7px}.guide{font-size:11px;padding:6px 8px}.pick{height:56px}.pick.sound{height:50px}.board{gap:4px}.sectionTitle{margin-top:6px}.resultOverlay{padding:10px}.result{width:96vw;max-height:88vh;display:block;padding:10px}.result img{display:block;width:100%;max-width:none;height:min(36vh,260px);min-height:0;margin:0 auto 8px}.bio h2{font-size:21px}.cry{font-size:18px}.desc{font-size:12px}.next{position:sticky;bottom:0}}

/* ガクハコへ戻る */
.home-back-btn {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 9999;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.88);
  color: #263238;
  border: 1px solid rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  text-decoration: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
.home-back-btn:hover { background: #fff; }
.home-back-btn:active { transform: scale(0.96); }
@media (max-width: 600px) {
  .home-back-btn {
    top: max(8px, env(safe-area-inset-top));
    left: 8px;
    padding: 7px 10px;
    font-size: 12px;
  }
}

</style></head><body><a href="/" class="home-back-btn" aria-label="ガクハコのトップへ戻る">← ガクハコ</a><main class="app"><div class="head"><div class="title">スズムシメモリーズ</div><div class="stats">獲得 <span id="got">0</span>/5　ミス <span id="miss">0</span></div></div><div class="guide" id="guide">伏せたイラストを<strong>長押し</strong>して、同じ虫を2枚そろえよう。</div><div class="sectionTitle">① 虫の名前</div><div id="names" class="row5"></div><div class="sectionTitle">② 鳴き声</div><div id="sounds" class="row5"></div><div class="sectionTitle">③ 虫のイラスト</div><div id="board" class="board"></div></main><div id="resultOverlay" class="resultOverlay" role="dialog" aria-modal="true" aria-label="虫の情報"><div id="result" class="result"></div></div><div id="overlay" class="overlay"><div class="finish"><h2>クリア！</h2><div id="score" class="big"></div><div id="rank"></div><button onclick="newGame()">もう一度あそぶ</button></div></div><script>
const DATA=[
{id:'suzumushi',name:'スズムシ',read:'すずむし',cry:'リーン、リーン',img:'images/suzumushi.png',audio:'audio/suzumushi.mp3',desc:'秋を代表する鳴く虫。オスが羽をこすり合わせて、すんだ音を出します。'},
{id:'matsumushi',name:'マツムシ',read:'まつむし',cry:'チンチロリン',img:'images/matsumushi.png',audio:'audio/matsumushi.mp3',desc:'草地などにすむ秋の虫。夜になると、かろやかな声で鳴きます。'},
{id:'enma',name:'エンマコオロギ',read:'えんまこおろぎ',cry:'コロコロコロリー',img:'images/enma_koorogi.png',audio:'audio/enma_koorogi.mp3',desc:'日本でよく見られる大型のコオロギ。草地や畑などで暮らします。'},
{id:'kanetataki',name:'カネタタキ',read:'かねたたき',cry:'チン、チン、チン',img:'images/kanetataki.png',audio:'audio/kanetataki.mp3',desc:'木の上や家のまわりでも見られる小さな虫。鐘をたたくような声が名前の由来です。'},
{id:'kantan',name:'カンタン',read:'かんたん',cry:'ルルルルル……',img:'images/kantan.png',audio:'audio/kantan.mp3',desc:'細長い体をした鳴く虫。クズなどの植物が茂る場所でよく見られます。'},
{id:'aomatsu',name:'アオマツムシ',read:'あおまつむし',cry:'リーリーリー',img:'images/aomatsumushi.png',audio:'audio/aomatsumushi.mp3',desc:'緑色の体をした虫。街路樹など木の上で暮らし、秋の夜に大きな声で鳴きます。'},
{id:'kutsuwa',name:'クツワムシ',read:'くつわむし',cry:'ガチャガチャガチャ',img:'images/kutsuwamushi.png',audio:'audio/kutsuwamushi.mp3',desc:'大きな体と力強い鳴き声が特徴。草のしげった場所に暮らします。'},
{id:'umaoi',name:'ハヤシノウマオイ',read:'はやしのうまおい',cry:'スイーッチョン',img:'images/hayashi_umaoi.png',audio:'audio/hayashi_umaoi.mp3',desc:'林や草木の多い場所にすむキリギリスの仲間。オスは「スイーッチョン」と聞こえる特徴的な声で鳴きます。'},
{id:'kirigiri',name:'キリギリス',read:'きりぎりす',cry:'ギーッチョン',img:'images/nishi_kirigirisu.png',audio:'audio/nishi_kirigirisu.mp3',desc:'草原にすむキリギリスの仲間。長い後ろ脚をもち、昼間にもよく鳴きます。'},
{id:'tsuyu',name:'ツユムシ',read:'つゆむし',cry:'ピチッ、ピチッ',img:'images/tsuyumushi.png',audio:'audio/tsuyumushi.mp3',desc:'細長い緑色の体をした虫。草の上で暮らし、小さな声で鳴きます。'}];
let chosen=[], deck=[], open=[], phase='photo', target=null, got=0, miss=0, lock=false;
let currentAudio=null; const audioCache={};
function playCry(x){
  if(!x||!x.audio)return;
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}
  const a=audioCache[x.id]||(audioCache[x.id]=new Audio(x.audio));
  currentAudio=a;a.currentTime=0;a.volume=.72;
  const pr=a.play(); if(pr&&pr.catch)pr.catch(()=>{});
}
const $=s=>document.querySelector(s); const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function hold(el,fn){let t; const start=e=>{if(lock||el.classList.contains('done'))return;e.preventDefault();el.classList.add('holding');t=setTimeout(()=>{el.classList.remove('holding');fn()},550)};const end=()=>{clearTimeout(t);el.classList.remove('holding')};el.addEventListener('pointerdown',start);['pointerup','pointercancel','pointerleave'].forEach(x=>el.addEventListener(x,end));el.addEventListener('contextmenu',e=>e.preventDefault())}
function newGame(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}chosen=shuffle(DATA).slice(0,5);deck=shuffle(chosen.flatMap(x=>[{...x,key:x.id+'a'},{...x,key:x.id+'b'}]));open=[];phase='photo';target=null;got=miss=0;lock=false;$('#got').textContent=0;$('#miss').textContent=0;$('#overlay').classList.remove('show');$('#resultOverlay').classList.remove('show');renderPicks();renderBoard();guide('伏せたイラストを長押しして、同じ虫を2枚そろえよう。')}
function renderPicks(){let ns=$('#names'),ss=$('#sounds');ns.innerHTML='';ss.innerHTML='';const nameOrder=shuffle(chosen),soundOrder=shuffle(chosen);nameOrder.forEach(x=>{let n=document.createElement('div');n.className='pick';n.dataset.id=x.id;n.innerHTML=`${x.name}<i class="holdbar"></i>`;hold(n,()=>pickName(x,n));ns.append(n)});soundOrder.forEach(x=>{let s=document.createElement('div');s.className='pick sound';s.dataset.id=x.id;s.innerHTML=`「${x.cry}」<i class="holdbar"></i>`;hold(s,()=>pickSound(x,s));ss.append(s)})}
function renderBoard(){let b=$('#board');b.innerHTML='';deck.forEach((x,i)=>{let c=document.createElement('div');c.className='card';c.dataset.i=i;c.innerHTML=`<div class="face back"><i class="holdbar"></i></div><div class="face front"><img src="${x.img}" alt="${x.name}" class="fit-contain"></div>`;hold(c,()=>flip(i,c));b.append(c)})}
function flip(i,c){if(phase!=='photo'||lock||c.classList.contains('flipped')||c.classList.contains('matched'))return;c.classList.add('flipped');open.push({i,c,x:deck[i]});if(open.length===2){lock=true;setTimeout(()=>{if(open[0].x.id===open[1].x.id){target=open[0].x;phase='name';document.querySelectorAll('#names .pick:not(.done)').forEach(e=>e.classList.add('target'));guide('イラストがそろった！ この虫の「名前」を長押ししよう。');lock=false}else{addMiss();open.forEach(o=>o.c.classList.remove('flipped'));open=[];lock=false;guide('ちがう虫です。もう一度さがそう。') }},650)}}
function pickName(x,el){if(phase!=='name')return;if(x.id!==target.id){addMiss();guide('名前がちがいます。もう一度考えよう。');return}document.querySelectorAll('#names .pick').forEach(e=>e.classList.remove('target'));el.classList.add('done');phase='sound';document.querySelectorAll('#sounds .pick:not(.done)').forEach(e=>e.classList.add('target'));guide('正解！ 次はこの虫の「鳴き声」を長押ししよう。')}
function pickSound(x,el){if(phase!=='sound')return;if(x.id!==target.id){addMiss();guide('鳴き声がちがいます。もう一度考えよう。');return}document.querySelectorAll('#sounds .pick').forEach(e=>e.classList.remove('target'));el.classList.add('done');open.forEach(o=>o.c.classList.add('matched'));showResult(target);playCry(target);got++;$('#got').textContent=got;phase='result'}
function showResult(x){let r=$('#result'),ro=$('#resultOverlay');r.innerHTML=`<img src="${x.img}" alt="${x.name}"><div class="bio"><h2>${x.name} <span class="reading">（${x.read}）</span></h2><div class="cry">♪「${x.cry}」</div><button class="listen" type="button">🔊 鳴き声をきく</button><div class="audioNote">※ 実際の鳴き方を参考にした学習用の合成音です</div><div class="desc">${x.desc}</div><button class="next">つぎへ</button></div>`;ro.classList.add('show');r.querySelector('.listen').onclick=()=>playCry(x);r.querySelector('.next').onclick=()=>{if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}ro.classList.remove('show');open=[];target=null;if(got>=5)return finish();phase='photo';guide('次の虫！ 伏せたイラストを2枚そろえよう。')}}
function addMiss(){miss++;$('#miss').textContent=miss}
function guide(t){$('#guide').innerHTML=t}
function finish(){let txt=miss===0?'パーフェクト！':miss<=3?'すばらしい！':miss<=7?'よくできました！':'クリアおめでとう！';$('#score').textContent=`ミス ${miss} 回`;$('#rank').textContent=txt;$('#overlay').classList.add('show')}
newGame();
</script></body></html>
