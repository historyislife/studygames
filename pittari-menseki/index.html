<style>

<body>
<a href="/" class="home-back-btn" aria-label="ガクハコのトップへ戻る">← ガクハコ</a>
<div class="wrap">
<h1>ぴったり面積</h1>
<div class="sub">ちがう形でも、面積は同じにできる！ 図形をスワイプするか数字を入力して、ぴったり同じ面積を作ろう。</div>
<div class="toolbar">
  <label class="pick"><span>🎯 目標の図形</span><select id="targetSelect"></select></label>
  <label class="pick"><span>✋ 動かす図形</span><select id="playSelect"></select></label>
  <button id="newBtn" class="primary">新しい問題</button>
</div>
<div id="goalBanner" class="goalBanner"></div>
<div class="grid">
  <section class="panel"><h2>🎯 目標</h2><div id="targetName" class="shapeName"></div><div id="targetArea" class="targetArea"></div><div id="targetFormula" class="formula"></div><svg id="targetSvg" class="svgbox" viewBox="0 0 400 300"></svg></section>
  <section class="panel"><h2>✋ 同じ面積にしよう</h2><div id="playName" class="shapeName"></div><div id="currentArea" class="targetArea"></div><div id="currentFormula" class="formula"></div><svg id="playSvg" class="svgbox" viewBox="0 0 400 300"></svg><div id="controls" class="controls"></div><div id="status" class="status"></div></section>
</div>
<div class="help"><b>遊び方：</b> 左の図形と<strong>別の種類の図形</strong>を、同じ面積になるように変形します。右の青い丸をスワイプすると、青字の「動かせる」部分が変わります。数字を直接入力しても図形が連動します。<br><span class="small">円・扇形を除き、できるだけ整数だけで解ける問題が出ます。多角形の辺は0.5cm刻み、円・扇形の半径は0.1cm刻み、中心角は切りのいい角度を中心に出題し、15°刻みで調整できます。円周率はπとして計算します。</span></div>
<section id="completion" class="completion" aria-live="polite">
  <h2>🎉 ぴったり！</h2>
  <button id="againBtn" class="completion-action">もう一度遊ぶ</button>
  <div class="result-pr" aria-label="保護者向けPR">
    <div class="result-pr-head">保護者の方へ <span>PR</span></div>
    <div class="a8-rotation-slot"></div>
  </div>
</section>
</div>
<!-- RESULT_AD_TEMPLATES -->
<script>
function showRandomResultAd(slot){const ads=["result-ad-1","result-ad-2","result-ad-3","result-ad-4","result-ad-5","result-ad-6"];slot.replaceChildren();const selected=ads[Math.floor(Math.random() * ads.length)];slot.append(document.getElementById(selected).content.cloneNode(true))}
const NS='http://www.w3.org/2000/svg'; const $=s=>document.querySelector(s);
const SHAPES={triangle:'三角形',square:'正方形',rectangle:'長方形',parallelogram:'平行四辺形',trapezoid:'台形',circle:'円',sector:'扇形'};
const keys=Object.keys(SHAPES), targetSelect=$('#targetSelect'), playSelect=$('#playSelect'), targetSvg=$('#targetSvg'), playSvg=$('#playSvg'), controls=$('#controls'), status=$('#status');
let problem=null,drag=null;
for(const k of keys){targetSelect.add(new Option(SHAPES[k],k));playSelect.add(new Option(SHAPES[k],k))} targetSelect.value='rectangle';playSelect.value='triangle';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), round05=v=>Math.round(v*100)/100, round5=v=>Math.round(v*10)/10, nice=n=>Number.isInteger(n)?String(n):n.toFixed(1).replace(/\.0$/,'');
const rand=(a,b,step=.5)=>Math.round((a+Math.random()*(b-a))/step)*step;
const randInt=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const polygonKeys=['triangle','square','rectangle','parallelogram','trapezoid'];
const polygonTypes=new Set(polygonKeys); const roundKeys=new Set(['circle','sector']);
const NICE_SECTOR_ANGLES=[30,45,60,90,120,180,240,270];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function el(tag,attrs={},text=''){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;return e}
function area(type,p){switch(type){case'triangle':return p.base*p.height/2;case'square':return p.side*p.side;case'rectangle':return p.width*p.height;case'parallelogram':return p.base*p.height;case'trapezoid':return (p.top+p.bottom)*p.height/2;case'circle':return Math.PI*p.radius*p.radius;case'sector':return Math.PI*p.radius*p.radius*p.angle/360}}
function formula(type,p){switch(type){case'triangle':return `底辺 ${nice(p.base)} × 高さ ${nice(p.height)} ÷ 2`;case'square':return `一辺 ${nice(p.side)} × ${nice(p.side)}`;case'rectangle':return `たて ${nice(p.height)} × よこ ${nice(p.width)}`;case'parallelogram':return `底辺 ${nice(p.base)} × 高さ ${nice(p.height)}`;case'trapezoid':return `（上底 ${nice(p.top)} ＋ 下底 ${nice(p.bottom)}）× 高さ ${nice(p.height)} ÷ 2`;case'circle':return `半径 ${nice(p.radius)} × 半径 ${nice(p.radius)} × π`;case'sector':return `半径 ${nice(p.radius)} の円 × ${nice(p.angle)}° / 360°`}}
function targetParams(type){
 switch(type){
  case'triangle':{let base=randInt(4,10),height=randInt(3,8);if((base*height)%2)base+=1;return{base,height}}
  case'square':return{side:randInt(3,7)};
  case'rectangle':{let width=randInt(5,11),height=randInt(2,7),tries=0;while((width===height||Math.max(width,height)/Math.min(width,height)<1.5)&&tries++<30){width=randInt(5,11);height=randInt(2,7)}return{width,height}};
  case'parallelogram':return{base:randInt(4,10),height:randInt(3,7)};
  case'trapezoid':{let top=randInt(2,6),bottom=randInt(6,11),height=randInt(3,6);if(((top+bottom)*height)%2)bottom+=1;return{top,bottom,height}}
  case'circle':return{radius:rand(2.5,5)};
  case'sector':return{radius:rand(3,6),angle:pick(NICE_SECTOR_ANGLES)}
 }
}
function startAwayFrom(answer,min=1,max=14){
 const offsets=[-3,-2,-1,1,2,3].map(d=>answer+d).filter(v=>v>=min&&v<=max);
 return offsets.length?pick(offsets):clamp(answer+(answer<max?1:-1),min,max);
}
function makePlayableInteger(type,A){
 if(!Number.isInteger(A))return null;
 if(type==='square'){
  const ans=Math.sqrt(A);if(!Number.isInteger(ans)||ans<1||ans>14)return null;
  return{p:{side:startAwayFrom(ans)},varKey:'side',answer:ans};
 }
 if(type==='rectangle'||type==='parallelogram'){
  const opts=[];for(let h=2;h<=10;h++)if(A%h===0){const ans=A/h;if(ans>=1&&ans<=14&&(type!=='rectangle'||(ans!==h&&Math.max(ans,h)/Math.min(ans,h)>=1.5)))opts.push({h,ans})}
  if(!opts.length)return null;const o=pick(opts);return{p:type==='rectangle'?{width:startAwayFrom(o.ans),height:o.h}:{base:startAwayFrom(o.ans),height:o.h},varKey:type==='rectangle'?'width':'base',answer:o.ans};
 }
 if(type==='triangle'){
  const opts=[];for(let h=2;h<=10;h++){const twice=2*A;if(twice%h===0){const ans=twice/h;if(ans>=1&&ans<=14)opts.push({h,ans})}}
  if(!opts.length)return null;const o=pick(opts);return{p:{base:startAwayFrom(o.ans),height:o.h},varKey:'base',answer:o.ans};
 }
 if(type==='trapezoid'){
  const opts=[];for(let h=2;h<=8;h++)for(let top=2;top<=8;top++){const twice=2*A;if(twice%h===0){const ans=twice/h-top;if(ans>=1&&ans<=14)opts.push({h,top,ans})}}
  if(!opts.length)return null;const o=pick(opts);return{p:{top:o.top,bottom:startAwayFrom(o.ans),height:o.h},varKey:'bottom',answer:o.ans};
 }
 return null;
}
function makePlayable(type,targetArea){let p,varKey,answer;
 if(type==='square'){answer=Math.sqrt(targetArea);p={side:clamp(round05(answer+(Math.random()<.5?-1:1)*rand(1,2)),1,14)};varKey='side'}
 else if(type==='circle'){answer=Math.sqrt(targetArea/Math.PI);p={radius:clamp(round05(answer+(Math.random()<.5?-1:1)*rand(.5,1.5)),1,10)};varKey='radius'}
 else if(type==='triangle'){const h=clamp(round05(2*targetArea/rand(4,10)),2,10);answer=2*targetArea/h;p={base:clamp(round05(answer+(Math.random()<.5?-1:1)*rand(1,2)),1,14),height:h};varKey='base'}
 else if(type==='rectangle'){let h=clamp(round05(targetArea/rand(4,10)),2,10),tries=0;answer=targetArea/h;while((Math.abs(answer-h)<0.5||Math.max(answer,h)/Math.max(Math.min(answer,h),.1)<1.5)&&tries++<40){h=rand(2,8);answer=targetArea/h}p={width:clamp(round05(answer+(Math.random()<.5?-1:1)*rand(1,2)),1,14),height:h};if(Math.abs(p.width-p.height)<0.5)p.width=clamp(p.width+1.5,1,14);varKey='width'}
 else if(type==='parallelogram'){const h=clamp(round05(targetArea/rand(4,10)),2,10);answer=targetArea/h;p={base:clamp(round05(answer+(Math.random()<.5?-1:1)*rand(1,2)),1,14),height:h};varKey='base'}
 else if(type==='trapezoid'){let h=rand(2,7),top=rand(2,6);answer=2*targetArea/h-top;let tries=0;while((answer<1||answer>14)&&tries++<50){h=rand(2,7);top=rand(2,6);answer=2*targetArea/h-top}if(answer<1||answer>14){h=2;top=2;answer=clamp(2*targetArea/h-top,1,14)}p={top,bottom:clamp(round05(answer+(Math.random()<.5?-1:1)*rand(1,2)),1,14),height:h};varKey='bottom'}
 else if(type==='sector'){let r=rand(2.5,7);answer=targetArea*360/(Math.PI*r*r);let tries=0;while((answer<20||answer>340)&&tries++<50){r=rand(2.5,7);answer=targetArea*360/(Math.PI*r*r)}if(answer<20||answer>340){r=Math.sqrt(targetArea*360/(Math.PI*180));answer=180}p={radius:round05(r),angle:clamp(round5(answer+(Math.random()<.5?-1:1)*[20,30,40][Math.floor(Math.random()*3)]),15,345)};answer=targetArea*360/(Math.PI*p.radius*p.radius);varKey='angle'}
 return{p,varKey,answer};
}
function makeProblem(){
 let t=targetSelect.value,s=playSelect.value;
 if(t===s){s=keys[(keys.indexOf(t)+1)%keys.length];playSelect.value=s}
 let target,tA,made;
 if(t==='circle'&&s==='sector'){
  const mode=Math.random()<0.5?'angle':'radius';
  const scale=pick([2,3]);
  const answerAngle=scale===2?90:40;
  const maxTargetR=scale===2?4:3;
  const r=pick(Array.from({length:maxTargetR-1},(_,i)=>i+2));
  target={radius:r};
  if(mode==='angle'){
   const starts=[30,45,60,120,135,180].filter(a=>a!==answerAngle);
   made={p:{radius:r*scale,angle:pick(starts)},varKey:'angle',answer:answerAngle};
  }else{
   const answerRadius=r*scale;
   const starts=[answerRadius-2,answerRadius-1,answerRadius+1,answerRadius+2].filter(v=>v>=1&&v<=14);
   made={p:{radius:pick(starts),angle:answerAngle},varKey:'radius',answer:answerRadius};
  }
  return{targetType:t,playType:s,target,play:made.p,varKey:made.varKey};
 }
 if(t==='sector'&&s==='circle'){
  const answer=pick([2,3,4]);
  target={radius:answer*2,angle:90};
  const start=pick([answer-1,answer+1].filter(v=>v>=1&&v<=14));
  made={p:{radius:start},varKey:'radius',answer};
  return{targetType:t,playType:s,target,play:made.p,varKey:made.varKey};
 }
 if(polygonTypes.has(t)&&polygonTypes.has(s)){
  for(let tries=0;tries<500;tries++){
   target=targetParams(t);tA=area(t,target);made=makePlayableInteger(s,tA);
   if(made)break;
  }
 }
 if(!made){target=targetParams(t);tA=area(t,target);made=makePlayable(s,tA)}
 return{targetType:t,playType:s,target,play:made.p,varKey:made.varKey}
}
function limits(key){return key==='angle'?[15,345]:[1,14]}
function setVar(v,fromInput=false){
 let[mn,mx]=limits(problem.varKey);v=clamp(v,mn,mx);
 if(!fromInput){
  if(problem.varKey==='angle') v=Math.round(v/5)*5;
  else if(roundKeys.has(problem.playType)) v=Math.round(v*10)/10;
  else v=Math.round(v*2)/2;
 }else{
  if(problem.varKey==='angle') v=Math.round(v*10)/10;
  else v=Math.round(v*100)/100;
 }

}
function addText(svg,x,y,text){svg.append(el('text',{x,y,class:'measure','text-anchor':'middle'},text))} function handle(svg,x,y,dir){const c=el('circle',{cx:x,cy:y,r:11,class:'handle '+(dir==='arc'?'arcHandle':'')});c.dataset.dir=dir;svg.append(c)}
function draw(svg,type,p,target=false,interactive=false){svg.innerHTML='';const cls=target?'targetShape':'shape',scale=19,cx=200,cy=150;
 if(type==='triangle'){const w=p.base*scale,ht=p.height*scale,x1=cx-w/2,x2=cx+w/2,yb=230,yt=yb-ht;svg.append(el('polygon',{points:`${x1},${yb} ${x2},${yb} ${cx},${yt}`,class:cls}));addText(svg,cx,yb+24,`${nice(p.base)} cm`);addText(svg,x1-22,(yb+yt)/2,`${nice(p.height)} cm`);if(interactive)handle(svg,x2,yb,'x')}
 else if(type==='square'){const s=p.side*scale,x=cx-s/2,y=cy-s/2;svg.append(el('rect',{x,y,width:s,height:s,class:cls}));addText(svg,cx,y+s+24,`${nice(p.side)} cm`);if(interactive)handle(svg,x+s,y+s/2,'x')}
 else if(type==='rectangle'){const w=p.width*scale,ht=p.height*scale,x=cx-w/2,y=cy-ht/2;svg.append(el('rect',{x,y,width:w,height:ht,class:cls}));addText(svg,cx,y+ht+24,`${nice(p.width)} cm`);addText(svg,x-22,cy,`${nice(p.height)} cm`);if(interactive)handle(svg,x+w,cy,'x')}
 else if(type==='parallelogram'){const w=p.base*scale,ht=p.height*scale,sk=30,x=cx-w/2,y=cy-ht/2;svg.append(el('polygon',{points:`${x+sk},${y} ${x+w+sk},${y} ${x+w},${y+ht} ${x},${y+ht}`,class:cls}));addText(svg,cx,y+ht+24,`${nice(p.base)} cm`);addText(svg,x-20,cy,`${nice(p.height)} cm`);if(interactive)handle(svg,x+w,y+ht,'x')}
 else if(type==='trapezoid'){const tw=p.top*scale,bw=p.bottom*scale,ht=p.height*scale,y=cy-ht/2;svg.append(el('polygon',{points:`${cx-tw/2},${y} ${cx+tw/2},${y} ${cx+bw/2},${y+ht} ${cx-bw/2},${y+ht}`,class:cls}));addText(svg,cx,y-10,`上底 ${nice(p.top)} cm`);addText(svg,cx,y+ht+24,`下底 ${nice(p.bottom)} cm`);addText(svg,cx-bw/2-28,cy,`${nice(p.height)} cm`);if(interactive)handle(svg,cx+bw/2,y+ht,'x')}
 else if(type==='circle'){const r=p.radius*scale;svg.append(el('circle',{cx,cy,r,class:cls}));svg.append(el('line',{x1:cx,y1:cy,x2:cx+r,y2:cy,stroke:'#617789','stroke-width':2}));addText(svg,cx+r/2,cy-10,`${nice(p.radius)} cm`);if(interactive)handle(svg,cx+r,cy,'x')}
 else if(type==='sector'){const r=p.radius*scale,a=p.angle*Math.PI/180,start=-Math.PI/2,end=start+a,x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end),large=p.angle>180?1:0,d=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;svg.append(el('path',{d,class:cls}));addText(svg,cx,cy+22,`${nice(p.angle)}°`);addText(svg,cx,cy+r+24,`半径 ${nice(p.radius)} cm`);if(interactive){if(problem.varKey==='radius')handle(svg,x1,y1,'radius');else handle(svg,x2,y2,'arc')}}
}
function defsFor(type){return type==='triangle'?[['底辺','base'],['高さ','height']]:type==='square'?[['一辺','side']]:type==='rectangle'?[['よこ','width'],['たて','height']]:type==='parallelogram'?[['底辺','base'],['高さ','height']]:type==='trapezoid'?[['上底','top'],['下底','bottom'],['高さ','height']]:type==='circle'?[['半径','radius']]:[['半径','radius'],['中心角','angle']]}
function field(label,key,fixed=false){const div=document.createElement('div');div.className='field '+(fixed?'fixed':'variable');const lab=document.createElement('label');lab.textContent=label;const inp=document.createElement('input');inp.type='number';inp.step=fixed?'1':(key==='angle'?'5':(roundKeys.has(problem.playType)?'0.1':'0.5'));inp.value=problem.play[key];inp.disabled=fixed;if(!fixed)inp.addEventListener('change',()=>{if(inp.value!=='')setVar(Number(inp.value),true)});div.append(lab,inp);return div}
function buildControls(){controls.innerHTML='';defsFor(problem.playType).forEach(([l,k])=>controls.append(field(l,k,k!==problem.varKey)))}
function render(){const tA=area(problem.targetType,problem.target),cA=area(problem.playType,problem.play);$('#targetName').textContent=SHAPES[problem.targetType];$('#playName').textContent=SHAPES[problem.playType];$('#goalBanner').innerHTML=`<b>${SHAPES[problem.targetType]}</b> と <b>${SHAPES[problem.playType]}</b> の面積を同じにしよう！`;$('#targetArea').textContent=`${tA.toFixed(1)} cm²`;$('#currentArea').textContent=`${cA.toFixed(1)} cm²`;$('#targetFormula').textContent=formula(problem.targetType,problem.target);$('#currentFormula').textContent=formula(problem.playType,problem.play);draw(targetSvg,problem.targetType,problem.target,true,false);draw(playSvg,problem.playType,problem.play,false,true);buildControls();const diff=Math.abs(tA-cA),ratio=diff/Math.max(tA,1),completion=$('#completion'),wasComplete=completion.classList.contains('show');status.className='status';document.body.classList.toggle('solved',diff<0.05);completion.classList.toggle('show',diff<0.05);if(diff<0.05){if(!wasComplete)showRandomResultAd(completion.querySelector('.a8-rotation-slot'));status.classList.add('ok');status.textContent='🎉 ぴったり！ ちがう形でも面積は同じ！'}else{completion.querySelector('.a8-rotation-slot').replaceChildren();if(ratio<.06){status.classList.add('near');status.textContent=cA<tA?'🔥 あと少し！ もう少し大きくしよう':'🔥 あと少し！ もう少し小さくしよう'}else status.textContent=cA<tA?'目標より小さいよ。図形を大きくしてみよう！':'目標より大きいよ。図形を小さくしてみよう！'}}
function randomizeShapePair(){
  const previous=problem?`${problem.targetType}|${problem.playType}`:'';
  let t,s,pair,tries=0;
  do{
    if(Math.random()<0.2){
      if(Math.random()<0.5){t='circle';s='sector'}else{t='sector';s='circle'}
    }else{
      t=pick(polygonKeys);
      s=pick(polygonKeys.filter(k=>k!==t));
    }
    pair=`${t}|${s}`;
  }while(pair===previous&&tries++<20);
  targetSelect.value=t;
  playSelect.value=s;
}
function newProblem(randomize=false){if(randomize)randomizeShapePair();problem=makeProblem();render()}
function enforcePairRule(changed){
 const t=targetSelect.value,s=playSelect.value;
 if(t==='circle'){playSelect.value='sector';return}
 if(t==='sector'){playSelect.value='circle';return}
 if(s==='circle'){targetSelect.value='sector';return}
 if(s==='sector'){targetSelect.value='circle';return}
 if(t===s){
   if(changed==='target') playSelect.value=polygonKeys[(polygonKeys.indexOf(t)+1)%polygonKeys.length];
   else targetSelect.value=polygonKeys[(polygonKeys.indexOf(s)+1)%polygonKeys.length];
 }
}
function pointerPos(e){const pt=playSvg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(playSvg.getScreenCTM().inverse())}
playSvg.addEventListener('pointerdown',e=>{if(e.target.classList.contains('handle')){e.preventDefault();playSvg.setPointerCapture(e.pointerId);drag={start:pointerPos(e),startVal:problem.play[problem.varKey],dir:e.target.dataset.dir}}});
playSvg.addEventListener('pointermove',e=>{if(!drag)return;const p=pointerPos(e);if(drag.dir==='x'){setVar(drag.startVal+(p.x-drag.start.x)/19)}else if(drag.dir==='radius'){setVar(Math.hypot(p.x-200,p.y-150)/19)}else{let ang=Math.atan2(p.y-150,p.x-200)*180/Math.PI+90;if(ang<0)ang+=360;setVar(ang)}});['pointerup','pointercancel'].forEach(ev=>playSvg.addEventListener(ev,()=>drag=null));
$('#newBtn').addEventListener('click',()=>newProblem(true));targetSelect.addEventListener('change',()=>{enforcePairRule('target');newProblem()});playSelect.addEventListener('change',()=>{enforcePairRule('play');newProblem()});
$('#againBtn').addEventListener('click',()=>newProblem(true));
newProblem();
</script>
</body>
